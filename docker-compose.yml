version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: eeg_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: eeg_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations/000001_init_schema.sql:/docker-entrypoint-initdb.d/01_init.sql
    networks:
      - eeg_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eeg_backend
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://postgres:postgrespassword@postgres:5432/eeg_db?sslmode=disable"
      JWT_SECRET: "eeg-platform-secure-jwt-academic-secret-key-32chars"
      CORS_ORIGIN: "http://localhost:3000"
    ports:
      - "8080:8080"
    networks:
      - eeg_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eeg_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8080/api"
      NEXT_PUBLIC_WS_URL: "ws://localhost:8080/ws/eeg"
    ports:
      - "3000:3000"
    networks:
      - eeg_network

volumes:
  pgdata:
    driver: local

networks:
  eeg_network:
    driver: bridge
